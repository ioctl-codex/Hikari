name: CI

# Builds the LLVM 22 pass plugin and gates it on the smoke test, which checks
# that obfuscated code still behaves like its original.  The seeded sweep
# (section 4) is the important one: every pass draws from a PRNG, so a
# miscompilation can hide behind a lucky draw and only show up in a user's build.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: "22"
  LLVM_PREFIX: /usr/lib/llvm-22
  # apt.llvm.org publishes LLVM 20+ only for the new-style suite names.
  LLVM_SUITE: llvm-toolchain-noble-22
  NDK_VERSION: r29

jobs:
  plugin:
    name: plugin + smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl gnupg ninja-build
          # libclang-common-$LLVM_VERSION-dev carries clang's builtin headers
          # (stddef.h and friends); without it the host -emit-llvm stage cannot
          # even include <stdio.h>.
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo gpg --dearmor -o /usr/share/keyrings/apt.llvm.org.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] http://apt.llvm.org/noble/ ${LLVM_SUITE} main" |
            sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            llvm-${LLVM_VERSION}-dev libclang-common-${LLVM_VERSION}-dev \
            clang-${LLVM_VERSION}
          "$LLVM_PREFIX/bin/opt" --version | head -3
          "$LLVM_PREFIX/bin/clang" --version | head -1

      - name: Build the plugin
        run: |
          set -euo pipefail
          cmake -G Ninja -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=ON \
                -DLT_LLVM_INSTALL_DIR="$LLVM_PREFIX"
          cmake --build build -j"$(nproc)"
          ls -la build/obfuscation/libHikari.so

      - name: Cache Android NDK ${{ env.NDK_VERSION }}
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-ndk-${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}-linux

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          set -euo pipefail
          NDK_DIR="$RUNNER_TEMP/android-ndk-${NDK_VERSION}"
          if [[ ! -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]]; then
            curl -fsSL -o "$RUNNER_TEMP/ndk.zip" \
              "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
            unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
            rm -f "$RUNNER_TEMP/ndk.zip"
          fi
          echo "HIKARI_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -1

      - name: Smoke test (host round-trip, AArch64, seeded sweep)
        run: |
          set -euo pipefail
          export HIKARI_PLUGIN="$PWD/build/obfuscation/libHikari.so"
          export HIKARI_CC="$LLVM_PREFIX/bin/clang"
          export HIKARI_OPT="$LLVM_PREFIX/bin/opt"
          ./tools/android-toolchain/smoke-test.sh

      # The smoke test compiles *groups* of passes once each.  This one runs the
      # cross product of samples, every pass on its own, the shipped pipelines
      # and several PRNG seeds — the shape that caught the unsigned-operand,
      # signed-GEP and constant-encryption bugs.  JOBS stays modest because a
      # virtualization-heavy cell is memory-hungry.
      - name: Differential stress (samples × passes × seeds)
        run: |
          set -euo pipefail
          export HIKARI_PLUGIN="$PWD/build/obfuscation/libHikari.so"
          export HIKARI_CC="$LLVM_PREFIX/bin/clang"
          export HIKARI_OPT="$LLVM_PREFIX/bin/opt"
          HIKARI_STRESS_SEEDS="${HIKARI_STRESS_SEEDS:-1 2 3}" \
          HIKARI_STRESS_JOBS=4 \
            ./tools/stress/stress-test.sh

      - name: Package the Android toolchain (full + slim)
        run: |
          set -euo pipefail
          export HIKARI_PLUGIN="$PWD/build/obfuscation/libHikari.so"
          ./tools/android-toolchain/package-toolchain.sh --full
          ./tools/android-toolchain/package-toolchain.sh --slim

      # A package that is never unpacked is a package nobody has tested.  The
      # full archive is verified with no HIKARI_NDK exported at all, which is the
      # whole point of shipping the NDK inside it.
      - name: Verify the full package stands alone
        run: ./tools/android-toolchain/verify-package.sh dist/hikari-android-toolchain-full.tar.*

      - name: Verify the slim package
        run: HIKARI_NDK="$HIKARI_NDK" ./tools/android-toolchain/verify-package.sh dist/hikari-android-toolchain-slim.tar.*

      - uses: actions/upload-artifact@v4
        with:
          name: hikari-android-toolchain
          path: |
            dist/hikari-android-toolchain-full.tar.*
            dist/hikari-android-toolchain-slim.tar.*
            build/obfuscation/libHikari.so
          if-no-files-found: error

  release:
    name: attach toolchain to release
    needs: plugin
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hikari-android-toolchain

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Idempotent: create the release if the tag has none, then upload.
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes "Automated build for $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" \
            dist/hikari-android-toolchain-full.tar.* \
            dist/hikari-android-toolchain-slim.tar.* \
            build/obfuscation/libHikari.so \
            -R "$GITHUB_REPOSITORY" --clobber
