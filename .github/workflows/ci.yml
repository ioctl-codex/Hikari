name: CI

# Builds the LLVM 22 pass plugin and gates it on the smoke test, which checks
# that obfuscated code still behaves like its original.  The seeded sweep
# (section 4) is the important one: every pass draws from a PRNG, so a
# miscompilation can hide behind a lucky draw and only show up in a user's build.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: "22"
  LLVM_PREFIX: /usr/lib/llvm-22
  # apt.llvm.org publishes LLVM 20+ only for the new-style suite names.
  #
  # jammy, not noble, and deliberately: the toolchain archives and the amd64
  # .deb both *bundle* the host's opt and libLLVM, so the runner's glibc becomes
  # a floor on where those packages can run.  Built on noble they carry glibc
  # 2.39 (Ubuntu 24.04+) while the README promises Ubuntu 22.04+ and Debian 12;
  # built on jammy they carry 2.35, which is what the published packages do.
  LLVM_SUITE: llvm-toolchain-jammy-22
  # The dist segment of apt.llvm.org's URL.  It has to move with LLVM_SUITE --
  # the suite names are per-distribution, so one without the other is a 404.
  LLVM_APT_DIST: jammy
  NDK_VERSION: r29

jobs:
  plugin:
    name: plugin + smoke test
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Anchored, because the package jobs below need the same LLVM: the amd64
      # .deb bundles this opt and its libLLVM, so it has to be this one.
      - &llvm_install
        name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl gnupg ninja-build
          # libclang-common-$LLVM_VERSION-dev carries clang's builtin headers
          # (stddef.h and friends); without it the host -emit-llvm stage cannot
          # even include <stdio.h>.
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo gpg --dearmor -o /usr/share/keyrings/apt.llvm.org.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] http://apt.llvm.org/${LLVM_APT_DIST}/ ${LLVM_SUITE} main" |
            sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            llvm-${LLVM_VERSION}-dev libclang-common-${LLVM_VERSION}-dev \
            clang-${LLVM_VERSION}
          "$LLVM_PREFIX/bin/opt" --version | head -3
          "$LLVM_PREFIX/bin/clang" --version | head -1

      - name: Build the plugin
        run: |
          set -euo pipefail
          cmake -G Ninja -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=ON \
                -DLT_LLVM_INSTALL_DIR="$LLVM_PREFIX"
          cmake --build build -j"$(nproc)"
          ls -la build/obfuscation/libHikari.so

      - name: Cache Android NDK ${{ env.NDK_VERSION }}
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-ndk-${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}-linux

      - &ndk_install
        name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          set -euo pipefail
          NDK_DIR="$RUNNER_TEMP/android-ndk-${NDK_VERSION}"
          if [[ ! -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]]; then
            curl -fsSL -o "$RUNNER_TEMP/ndk.zip" \
              "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
            unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
            rm -f "$RUNNER_TEMP/ndk.zip"
          fi
          echo "HIKARI_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -1

      - name: Smoke test (host round-trip, AArch64, seeded sweep)
        run: |
          set -euo pipefail
          export HIKARI_PLUGIN="$PWD/build/obfuscation/libHikari.so"
          export HIKARI_CC="$LLVM_PREFIX/bin/clang"
          export HIKARI_OPT="$LLVM_PREFIX/bin/opt"
          ./tools/android-toolchain/smoke-test.sh

      # The smoke test compiles *groups* of passes once each.  This one runs the
      # cross product of samples, every pass on its own, the shipped pipelines
      # and several PRNG seeds — the shape that caught the unsigned-operand,
      # signed-GEP and constant-encryption bugs.  JOBS stays modest because a
      # virtualization-heavy cell is memory-hungry.
      - name: Differential stress (samples × passes × seeds)
        run: |
          set -euo pipefail
          export HIKARI_PLUGIN="$PWD/build/obfuscation/libHikari.so"
          export HIKARI_CC="$LLVM_PREFIX/bin/clang"
          export HIKARI_OPT="$LLVM_PREFIX/bin/opt"
          HIKARI_STRESS_SEEDS="${HIKARI_STRESS_SEEDS:-1 2 3}" \
          HIKARI_STRESS_JOBS=4 \
            ./tools/stress/stress-test.sh

      - name: Install qemu-user (for running the Android binaries)
        run: sudo apt-get install -y --no-install-recommends qemu-user-static

      # Compiling an object for aarch64 only proves the pass did not crash the
      # *frontend*: it says nothing about whether the code still computes the
      # right answer on a 32-bit target, where the pointer-size assumptions that
      # produced the signed-GEP bug live.  This runs the binaries.  One seed is
      # enough here — the seeded sweep is the host job's business — so the time
      # goes into breadth of architectures instead.
      - name: Cross-ABI execution under qemu
        run: |
          set -euo pipefail
          export HIKARI_PLUGIN="$PWD/build/obfuscation/libHikari.so"
          export HIKARI_OPT="$LLVM_PREFIX/bin/opt"
          HIKARI_CROSS_ABIS="aarch64 armv7a" \
          HIKARI_CROSS_SEEDS=1 \
          HIKARI_CROSS_TIMEOUT=300 \
            ./tools/stress/cross-run.sh

      - name: Package the Android toolchain (full + slim)
        run: |
          set -euo pipefail
          export HIKARI_PLUGIN="$PWD/build/obfuscation/libHikari.so"
          ./tools/android-toolchain/package-toolchain.sh --full
          ./tools/android-toolchain/package-toolchain.sh --slim

      # A package that is never unpacked is a package nobody has tested.  The
      # full archive is verified with no HIKARI_NDK exported at all, which is the
      # whole point of shipping the NDK inside it.
      - name: Verify the full package stands alone
        run: ./tools/android-toolchain/verify-package.sh dist/hikari-android-toolchain-full.tar.*

      - name: Verify the slim package
        run: HIKARI_NDK="$HIKARI_NDK" ./tools/android-toolchain/verify-package.sh dist/hikari-android-toolchain-slim.tar.*

      - uses: actions/upload-artifact@v4
        with:
          name: hikari-android-toolchain
          path: |
            dist/hikari-android-toolchain-full.tar.*
            dist/hikari-android-toolchain-slim.tar.*
            build/obfuscation/libHikari.so
          if-no-files-found: error

      # The package jobs want the plugin, not 240 MB of toolchain archives.
      - uses: actions/upload-artifact@v4
        with:
          name: libHikari
          path: build/obfuscation/libHikari.so
          if-no-files-found: error

  # The release ships three .deb packages.  Building them here is what keeps
  # them from being something only a hand-run on one VPS could reproduce -- and
  # each one is checked by installing it and *running* what it produces, since a
  # package that has never been unpacked is a package nobody has tested.
  #
  # arm64 is not here: it needs qemu and a chroot, so it has its own job below.
  packages:
    name: .deb packages (amd64, Termux aarch64)
    runs-on: ubuntu-22.04
    needs: plugin
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - *llvm_install

      - name: Cache Android NDK ${{ env.NDK_VERSION }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-ndk-${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}-linux

      - *ndk_install

      - uses: actions/download-artifact@v4
        with:
          name: libHikari
          path: plugin

      # The amd64 package bundles this exact opt and libLLVM, which is the only
      # way to guarantee the plugin ABI match the package exists to provide.
      - name: Build, install and exercise the amd64 .deb
        env:
          HIKARI_PLUGIN: ${{ github.workspace }}/plugin/libHikari.so
          LLVM_PREFIX: /usr/lib/llvm-22
          VERSION: "1.0.0"
          DEB_ARCH: amd64
          GIT_COMMIT_HASH: ${{ github.sha }}
        run: |
          set -euo pipefail
          ./tools/deb/build-deb.sh
          sudo ./tools/deb/verify-deb.sh dist/hikari_1.0.0_amd64.deb
          dpkg-deb -I dist/hikari_1.0.0_amd64.deb

      # Cross-compiled against Termux's own headers and libLLVM, resolved from
      # Termux's package index so the version is whatever Termux ships today.
      # There is no Termux device on a runner, so what this proves is that the
      # plugin is a real aarch64 object whose every LLVM symbol the libLLVM it
      # links against actually exports -- see the checks at the end of the
      # script.  The on-device route is tools/termux/build.sh.
      - name: Build the Termux (aarch64) .deb against Termux's own LLVM
        run: |
          set -euo pipefail
          # llvm-strip: the distribution's strip may not know aarch64.
          export PATH="$LLVM_PREFIX/bin:$PATH"
          sudo HIKARI_NDK="$HIKARI_NDK" VERSION=1.0.0 \
            ./tools/termux/build-cross.sh --package
          ls -la dist/*.deb
          dpkg-deb -I dist/hikari_1.0.0_aarch64.deb

      # A Termux package is *installed by unpacking it at / inside $PREFIX*, so a
      # path outside that prefix would be written straight into the device's
      # filesystem.  Every entry must either be the prefix, one of its ancestor
      # directories, or something inside it.
      - name: Check the Termux package stays inside the Termux prefix
        run: |
          set -euo pipefail
          dpkg-deb -c dist/hikari_1.0.0_aarch64.deb | sed 's/ -> .*//' |
            awk '{ print $NF }' | sort -u > /tmp/paths.txt
          # Directory entries keep their trailing slash, so the ancestors are
          # spelled out rather than nested into one optional group.
          ANC='^\./$|^\./data/$|^\./data/data/$|^\./data/data/com\.termux/$|^\./data/data/com\.termux/files/$'
          total=$(wc -l < /tmp/paths.txt)
          inside=$(grep -c '^\./data/data/com\.termux/files/usr' /tmp/paths.txt || true)
          ancestors=$(grep -cE "$ANC" /tmp/paths.txt || true)
          echo "payload entries: $total ($inside inside the prefix, $ancestors ancestors)"
          if [[ "$total" != "$((inside + ancestors))" ]]; then
            echo 'entries outside ./data/data/com.termux/files/usr:' >&2
            grep -vE "$ANC|^\./data/data/com\.termux/files/usr" /tmp/paths.txt >&2 || true
            exit 1
          fi
          grep -q '/lib/hikari/lib/libHikari.so$' /tmp/paths.txt
          grep -q '/share/doc/hikari/README.md$' /tmp/paths.txt
          echo 'payload is Termux-relative and carries the plugin and its docs'

      - uses: actions/upload-artifact@v4
        with:
          name: hikari-debs
          path: dist/*.deb
          if-no-files-found: error

  # arm64 is built inside an arm64 Ubuntu chroot under qemu-user-static: LLVM's
  # cmake config bakes in absolute paths, and the plugin has to link against the
  # same libLLVM the packaged opt will load.  In the chroot both sides are real,
  # so nothing is patched -- and the finished package can be installed and run
  # there, which is the only way to exercise an arm64 build on an x86_64 runner.
  #
  # It takes ten to twenty minutes, so it is not on every push: a tag or a manual
  # dispatch is when the package actually matters.
  arm64-deb:
    name: arm64 .deb (chroot under qemu)
    runs-on: ubuntu-22.04
    needs: plugin
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 120
    env:
      # The jammy chroot has its own suite; the workflow-level one is for the
      # noble runner and would 404 inside it.
      DISTRO: jammy
      LLVM_SUITE: llvm-toolchain-jammy-22
    steps:
      - uses: actions/checkout@v4
      - name: Build, install and run the arm64 .deb under emulation
        run: |
          set -euo pipefail
          sudo ARCHROOT=/opt/hikari-arm64-chroot ./tools/deb/build-deb-arm64.sh
          ls -la dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: hikari-deb-arm64
          path: dist/hikari_*_arm64.deb
          if-no-files-found: error

  # Everything the release publishes is built by the jobs above and attached
  # here, so a tag is all it takes to produce the artifacts -- nothing depends on
  # a particular machine having been used.  Each .deb reaches this point only
  # after the job that built it installed and ran it.
  release:
    name: attach the packages to the release
    needs: [plugin, packages, arm64-deb]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hikari-android-toolchain
          path: .

      # Both .deb artifacts are downloaded into dist/ so the upload glob below
      # does not have to know which job produced which package.
      - uses: actions/download-artifact@v4
        with:
          name: hikari-debs
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: hikari-deb-arm64
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Idempotent: create the release if the tag has none, then upload.
          # --clobber, so re-running a tag replaces rather than 422s.
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes "Built and verified by CI. See the README for what each artifact is." \
              --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            dist/hikari-android-toolchain-full.tar.* \
            dist/hikari-android-toolchain-slim.tar.* \
            build/obfuscation/libHikari.so \
            dist/*.deb \
            -R "$GITHUB_REPOSITORY" --clobber
