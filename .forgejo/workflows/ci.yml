name: CI

# Forgejo Actions on Codeberg.  Same gates as the GitHub workflow; only where
# they run, and what they assume, differs.
#
# `runs-on: self-hosted` for everything except the syntax check, and that is a
# deliberate choice rather than an omission.  Codeberg's shared runners cap a job
# at 10 minutes on the largest label (`codeberg-medium`: 4 CPU, 8 GB, 10 min),
# and the RAM quote counts filesystem writes too.  This pipeline cannot fit: the
# plugin build alone spends most of that budget before the NDK download, the
# seeded sweep or the qemu matrix start.  Pointing a job at a shared label would
# mean a workflow that always times out, which is worse than no workflow at all.
#
# Two consequences worth knowing before editing this file:
#
#   * The heavy jobs assume nothing about the machine beyond the toolchain it
#     declares.  LLVM_PREFIX, HIKARI_OPT, HIKARI_CC and HIKARI_NDK come from the
#     runner's own environment (see docs/CI.md); the installs below are fallbacks
#     for a machine that declares nothing, and they fail loudly rather than
#     hanging on an interactive sudo prompt.
#   * Nothing here hardcodes a machine path in the workflow `env:` block.  A
#     workflow-level env var overrides what the runner exports, which would make
#     a runner's own toolchain invisible and silently re-download a gigabyte.
#
# Packaging is a tag-only job.  Compressing a ~1 GB toolchain is the slowest step
# by far and produces files nobody consumes on a push, so pushes run the
# correctness gates and tags additionally build and publish the artifacts.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: "22"
  LLVM_SUITE: llvm-toolchain-noble-22
  NDK_VERSION: r29

jobs:
  # Cheap enough for a hosted runner (codeberg-tiny: 1 CPU, 2 GB, 2 min).  No
  # build, no LLVM: a shell syntax error in a gate script is the one class of
  # mistake that silently disables a check, because a script that fails to parse
  # never reports anything.
  lint:
    name: shell syntax
    runs-on: codeberg-tiny
    steps:
      - uses: actions/checkout@v4
      - name: bash -n over every tool script
        run: |
          set -euo pipefail
          bash -n ./tools/android-toolchain/hikari-clang
          while IFS= read -r s; do
            bash -n "$s"
            echo "  ok $s"
          done < <(find tools -name '*.sh' | sort)
          echo "all scripts parse"

  gates:
    name: plugin + smoke + stress + cross-ABI
    needs: lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the toolchain
        run: |
          set -euo pipefail
          # Two trees, and they are legitimately not the same one.  HIKARI_OPT is
          # the runtime that loads the plugin; a packaged toolchain ships it
          # without headers.  LLVM_PREFIX is what the plugin is *built* against
          # and needs lib/cmake/llvm.  Both come from the runner when it declares
          # them; deriving the build tree from opt is only a convenience for a
          # full LLVM install where one tree serves both roles.
          if [[ -z "${LLVM_PREFIX:-}" && -n "${HIKARI_OPT:-}" ]]; then
            LLVM_PREFIX="$(cd "$(dirname "$HIKARI_OPT")/.." && pwd)"
          fi
          LLVM_PREFIX="${LLVM_PREFIX:-/usr/lib/llvm-22}"
          HIKARI_OPT="${HIKARI_OPT:-$LLVM_PREFIX/bin/opt}"
          HIKARI_CC="${HIKARI_CC:-$LLVM_PREFIX/bin/clang}"
          {
            echo "LLVM_PREFIX=$LLVM_PREFIX"
            echo "HIKARI_OPT=$HIKARI_OPT"
            echo "HIKARI_CC=$HIKARI_CC"
            [[ -n "${HIKARI_NDK:-}" ]]   && echo "HIKARI_NDK=$HIKARI_NDK"
            [[ -n "${LD_LIBRARY_PATH:-}" ]] && echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          } >> "$GITHUB_ENV"
          echo "toolchain:"
          echo "  opt (loads the plugin): $HIKARI_OPT"
          echo "  build tree:             $LLVM_PREFIX"
          echo "  host clang:             $HIKARI_CC"
          echo "  ndk:                    ${HIKARI_NDK:-<not declared, will download>}"

      - name: Check the toolchain is complete
        run: |
          set -euo pipefail
          missing=()
          [[ -x "$HIKARI_OPT" ]] || missing+=("opt that loads the plugin: $HIKARI_OPT")
          [[ -f "$LLVM_PREFIX/lib/cmake/llvm/LLVMConfig.cmake" ]] ||
            missing+=("LLVM dev tree to build against: $LLVM_PREFIX/lib/cmake/llvm/LLVMConfig.cmake")
          [[ -x "$HIKARI_CC" ]] || missing+=("host clang: $HIKARI_CC")
          if ((${#missing[@]})); then
            printf 'missing toolchain component: %s\n' "${missing[@]}" >&2
            echo "declare the paths on the runner (LLVM_PREFIX, HIKARI_OPT, HIKARI_CC," >&2
            echo "HIKARI_NDK) instead of relying on an install step; see docs/CI.md" >&2
            exit 1
          fi
          "$HIKARI_OPT" --version | head -1
          "$HIKARI_CC" --version | head -1

      - name: Ensure qemu-user
        run: |
          set -euo pipefail
          for q in qemu-aarch64-static qemu-arm-static; do
            command -v "$q" >/dev/null && continue
            sudo -n apt-get update && sudo -n apt-get install -y --no-install-recommends qemu-user-static
            break
          done
          command -v qemu-aarch64-static qemu-arm-static

      - name: Ensure Android NDK
        run: |
          set -euo pipefail
          if [[ -n "${HIKARI_NDK:-}" && -x "$HIKARI_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]]; then
            echo "using declared HIKARI_NDK=$HIKARI_NDK"
            exit 0
          fi
          NDK_DIR="$RUNNER_TEMP/android-ndk-${NDK_VERSION}"
          if [[ ! -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]]; then
            curl -fsSL -o "$RUNNER_TEMP/ndk.zip" \
              "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
            unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
            rm -f "$RUNNER_TEMP/ndk.zip"
          fi
          echo "HIKARI_NDK=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Build the plugin
        run: |
          set -euo pipefail
          cmake -G Ninja -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=ON \
                -DLT_LLVM_INSTALL_DIR="$LLVM_PREFIX"
          cmake --build build -j"$(nproc)"
          ls -la build/obfuscation/libHikari.so

      - name: Smoke test (host round-trip, AArch64, -g, seeded sweep)
        run: |
          set -euo pipefail
          export HIKARI_PLUGIN="$PWD/build/obfuscation/libHikari.so"
          ./tools/android-toolchain/smoke-test.sh

      - name: Differential stress (samples x passes x seeds)
        run: |
          set -euo pipefail
          export HIKARI_PLUGIN="$PWD/build/obfuscation/libHikari.so"
          HIKARI_STRESS_SEEDS="${HIKARI_STRESS_SEEDS:-1 2 3}" \
          HIKARI_STRESS_JOBS="${HIKARI_STRESS_JOBS:-2}" \
            ./tools/stress/stress-test.sh

      - name: Cross-ABI execution under qemu
        run: |
          set -euo pipefail
          export HIKARI_PLUGIN="$PWD/build/obfuscation/libHikari.so"
          HIKARI_CROSS_ABIS="aarch64 armv7a" \
          HIKARI_CROSS_SEEDS=1 \
          HIKARI_CROSS_TIMEOUT=300 \
            ./tools/stress/cross-run.sh

  # Tag-only: the archives are only consumed by a release, and compressing ~1 GB
  # is the slowest thing in the pipeline.
  package:
    name: package + verify toolchain
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the toolchain
        run: |
          set -euo pipefail
          if [[ -z "${LLVM_PREFIX:-}" && -n "${HIKARI_OPT:-}" && -x "${HIKARI_OPT}" ]]; then
            LLVM_PREFIX="$(cd "$(dirname "$HIKARI_OPT")/.." && pwd)"
          fi
          echo "LLVM_PREFIX=${LLVM_PREFIX:-/usr/lib/llvm-22}" >> "$GITHUB_ENV"

      - name: Build the plugin
        run: |
          set -euo pipefail
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=ON -DLT_LLVM_INSTALL_DIR="$LLVM_PREFIX"
          cmake --build build -j"$(nproc)"

      - name: Package the Android toolchain (full + slim)
        run: |
          set -euo pipefail
          export HIKARI_PLUGIN="$PWD/build/obfuscation/libHikari.so"
          ./tools/android-toolchain/package-toolchain.sh --full
          ./tools/android-toolchain/package-toolchain.sh --slim

      # A package that is never unpacked is a package nobody has tested.  The
      # full archive is verified with HIKARI_NDK removed from the environment,
      # which is the whole point of shipping the NDK inside it.
      - name: Verify the full package stands alone
        run: env -u HIKARI_NDK ./tools/android-toolchain/verify-package.sh dist/hikari-android-toolchain-full.tar.*

      - name: Verify the slim package
        run: ./tools/android-toolchain/verify-package.sh dist/hikari-android-toolchain-slim.tar.*

      - uses: https://code.forgejo.org/actions/upload-artifact@v4
        with:
          name: hikari-android-toolchain
          path: |
            dist/hikari-android-toolchain-full.tar.*
            dist/hikari-android-toolchain-slim.tar.*
            build/obfuscation/libHikari.so
          if-no-files-found: error

  release:
    name: attach toolchain to release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: https://code.forgejo.org/actions/download-artifact@v4
        with:
          name: hikari-android-toolchain

      # fj (forgejo-cli) is the Forgejo equivalent of gh.  It has no env-var
      # token; `fj auth add-token` reads the key from stdin and stores it.
      - name: Authenticate fj
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$CODEBERG_TOKEN" ]] || { echo "set the CODEBERG_TOKEN secret (scopes: write:repository)" >&2; exit 1; }
          printf '%s' "$CODEBERG_TOKEN" | fj auth add-token --host https://codeberg.org

      - name: Publish
        env:
          HOST: https://codeberg.org
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          REPO="$GITHUB_REPOSITORY"
          # The compressor depends on what the runner has, so glob it.
          full="$(ls dist/hikari-android-toolchain-full.tar.* | head -1)"
          slim="$(ls dist/hikari-android-toolchain-slim.tar.* | head -1)"
          if fj release view "$TAG" --host "$HOST" --repo "$REPO" >/dev/null 2>&1; then
            for f in "$full" "$slim" build/obfuscation/libHikari.so; do
              fj release asset create "$TAG" "$f" --host "$HOST" --repo "$REPO" || true
            done
          else
            fj release create "$TAG" --host "$HOST" --repo "$REPO" \
              --tag "$TAG" --body "Automated build for $TAG" \
              --attach "$full" --attach "$slim" --attach build/obfuscation/libHikari.so
          fi
