name: CI

# Forgejo Actions on Codeberg.  The steps are the same gates as the GitHub
# workflow; only where they run differs.
#
# `runs-on: self-hosted`, not a Codeberg-hosted label, and that is a deliberate
# choice rather than an omission.  Codeberg's shared runners cap a job at 10
# minutes on the largest label (`codeberg-medium`: 4 CPU, 8 GB, 10 min), and the
# RAM quote even counts filesystem writes.  This pipeline cannot fit in that:
# installing LLVM 22 plus the plugin build alone spent most of a GitHub runner's
# budget before the NDK download, the seeded sweep or the qemu matrix started.
# Pointing a job at a shared label would therefore mean a workflow that always
# times out, which is worse than no workflow at all.
#
# So: register a runner on a machine that already has the toolchain (see
# https://docs.codeberg.org/ci/actions/), and it picks these jobs up with no time
# or memory ceiling.  Env overrides below let it use a packaged toolchain instead
# of a system LLVM.
#
# Hosted runners are still fine for the cheap gates — see the `lint` job, which
# only needs bash and fits `codeberg-tiny`.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: "22"
  LLVM_PREFIX: /usr/lib/llvm-22
  LLVM_SUITE: llvm-toolchain-noble-22
  NDK_VERSION: r29

jobs:
  # Cheap enough for a hosted runner (codeberg-tiny: 1 CPU, 2 GB, 2 min).  No
  # build, no LLVM: a shell syntax error in a gate script is the one class of
  # mistake that silently disables a check, because a script that fails to parse
  # never reports anything.
  lint:
    name: shell syntax
    runs-on: codeberg-tiny
    steps:
      - uses: actions/checkout@v4
      - name: bash -n over every tool script
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find tools -name '*.sh' -o -name 'hikari-clang')
          bash -n ./tools/android-toolchain/hikari-clang
          for s in "${scripts[@]}"; do
            bash -n "$s"
            echo "  ok $s"
          done
          echo "all scripts parse"

  gates:
    name: plugin + smoke + stress + cross-ABI
    needs: lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # A self-hosted runner is expected to have LLVM 22 and an NDK already; the
      # installs below are the fallback, and are skipped when the tools are there
      # so a warm machine does not re-download a gigabyte per push.
      - name: Ensure LLVM ${{ env.LLVM_VERSION }}
        run: |
          set -euo pipefail
          if [[ -x "$LLVM_PREFIX/bin/opt" ]]; then
            "$LLVM_PREFIX/bin/opt" --version | head -1
            exit 0
          fi
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo gpg --dearmor -o /usr/share/keyrings/apt.llvm.org.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] http://apt.llvm.org/noble/ ${LLVM_SUITE} main" |
            sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl gnupg ninja-build cmake \
            llvm-${LLVM_VERSION}-dev libclang-common-${LLVM_VERSION}-dev \
            clang-${LLVM_VERSION} qemu-user-static
          "$LLVM_PREFIX/bin/opt" --version | head -1

      - name: Ensure qemu-user
        run: |
          set -euo pipefail
          for q in qemu-aarch64-static qemu-arm-static; do
            command -v "$q" >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user-static; break; }
          done
          command -v qemu-aarch64-static qemu-arm-static

      - name: Ensure Android NDK
        run: |
          set -euo pipefail
          if [[ -n "${HIKARI_NDK:-}" && -x "$HIKARI_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]]; then
            echo "using existing HIKARI_NDK=$HIKARI_NDK"
            exit 0
          fi
          NDK_DIR="$RUNNER_TEMP/android-ndk-${NDK_VERSION}"
          if [[ ! -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]]; then
            curl -fsSL -o "$RUNNER_TEMP/ndk.zip" \
              "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
            unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
            rm -f "$RUNNER_TEMP/ndk.zip"
          fi
          echo "HIKARI_NDK=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Build the plugin
        run: |
          set -euo pipefail
          cmake -G Ninja -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=ON \
                -DLT_LLVM_INSTALL_DIR="$LLVM_PREFIX"
          cmake --build build -j"$(nproc)"
          ls -la build/obfuscation/libHikari.so

      - name: Smoke test (host round-trip, AArch64, -g, seeded sweep)
        run: |
          set -euo pipefail
          export HIKARI_PLUGIN="$PWD/build/obfuscation/libHikari.so"
          export HIKARI_CC="$LLVM_PREFIX/bin/clang"
          export HIKARI_OPT="$LLVM_PREFIX/bin/opt"
          ./tools/android-toolchain/smoke-test.sh

      - name: Differential stress (samples x passes x seeds)
        run: |
          set -euo pipefail
          export HIKARI_PLUGIN="$PWD/build/obfuscation/libHikari.so"
          export HIKARI_CC="$LLVM_PREFIX/bin/clang"
          export HIKARI_OPT="$LLVM_PREFIX/bin/opt"
          HIKARI_STRESS_SEEDS="${HIKARI_STRESS_SEEDS:-1 2 3}" \
          HIKARI_STRESS_JOBS="${HIKARI_STRESS_JOBS:-2}" \
            ./tools/stress/stress-test.sh

      - name: Cross-ABI execution under qemu
        run: |
          set -euo pipefail
          export HIKARI_PLUGIN="$PWD/build/obfuscation/libHikari.so"
          export HIKARI_OPT="$LLVM_PREFIX/bin/opt"
          HIKARI_CROSS_ABIS="aarch64 armv7a" \
          HIKARI_CROSS_SEEDS=1 \
          HIKARI_CROSS_TIMEOUT=300 \
            ./tools/stress/cross-run.sh

      - name: Package the Android toolchain (full + slim)
        run: |
          set -euo pipefail
          export HIKARI_PLUGIN="$PWD/build/obfuscation/libHikari.so"
          ./tools/android-toolchain/package-toolchain.sh --full
          ./tools/android-toolchain/package-toolchain.sh --slim

      - name: Verify the full package stands alone
        run: ./tools/android-toolchain/verify-package.sh dist/hikari-android-toolchain-full.tar.*

      - name: Verify the slim package
        run: HIKARI_NDK="$HIKARI_NDK" ./tools/android-toolchain/verify-package.sh dist/hikari-android-toolchain-slim.tar.*

      - uses: https://code.forgejo.org/actions/upload-artifact@v4
        with:
          name: hikari-android-toolchain
          path: |
            dist/hikari-android-toolchain-full.tar.*
            dist/hikari-android-toolchain-slim.tar.*
            build/obfuscation/libHikari.so
          if-no-files-found: error

  release:
    name: attach toolchain to release
    needs: gates
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: https://code.forgejo.org/actions/download-artifact@v4
        with:
          name: hikari-android-toolchain

      # fj (forgejo-cli) is the Forgejo equivalent of gh.  It has no env-var
      # token; `fj auth add-token` reads the key from stdin and stores it.
      - name: Authenticate fj
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$CODEBERG_TOKEN" ]] || { echo "set the CODEBERG_TOKEN secret (scopes: write:repository)" >&2; exit 1; }
          printf '%s' "$CODEBERG_TOKEN" | fj auth add-token --host https://codeberg.org

      - name: Publish
        env:
          HOST: https://codeberg.org
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          REPO="$GITHUB_REPOSITORY"
          # The compressor depends on what the runner has, so glob it.
          full="$(ls dist/hikari-android-toolchain-full.tar.* | head -1)"
          slim="$(ls dist/hikari-android-toolchain-slim.tar.* | head -1)"
          if fj release view "$TAG" --host "$HOST" --repo "$REPO" >/dev/null 2>&1; then
            for f in "$full" "$slim" build/obfuscation/libHikari.so; do
              fj release asset create "$TAG" "$f" --host "$HOST" --repo "$REPO" || true
            done
          else
            fj release create "$TAG" --host "$HOST" --repo "$REPO" \
              --tag "$TAG" --body "Automated build for $TAG" \
              --attach "$full" --attach "$slim" --attach build/obfuscation/libHikari.so
          fi
